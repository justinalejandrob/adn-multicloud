<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADN Multinube</title>
  <meta name="description" content="Clúster de ADN en 5 nubes: procesamiento, rendimiento, comparación de proveedores y Evaluación S11">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem("adn-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <!-- ================= Barra lateral ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" data-icon="dna"></div>
      <div class="brand-text">
        <div class="brand-name">ADN Multinube</div>
        <div class="brand-sub">Cloud Computing · PDN</div>
      </div>
    </div>
    <div class="nav-label">Secciones</div>
    <nav class="nav" aria-label="Secciones">
      <a href="#panel" data-view="panel"><i data-icon="grid"></i><span>Panel principal</span></a>
      <a href="#adn" data-view="adn"><i data-icon="dna"></i><span>Procesamiento ADN</span></a>
      <a href="#rendimiento" data-view="rendimiento"><i data-icon="gauge"></i><span>Rendimiento</span></a>
      <a href="#multicloud" data-view="multicloud"><i data-icon="cloud"></i><span>Multicloud</span></a>
      <a href="#cluster" data-view="cluster"><i data-icon="network"></i><span>Clúster</span></a>
      <a href="#evaluacion" data-view="evaluacion"><i data-icon="clipboard"></i><span>Evaluación S11</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="cloud-chip">
        <div class="label">Ejecutando en</div>
        <div class="value" id="side-provider">…</div>
        <div class="muted" id="side-region" style="font-size:12px"></div>
      </div>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Cambiar tema">
        <i data-icon="contrast"></i><span>Cambiar tema</span>
      </button>
    </div>
  </aside>

  <!-- ================= Contenido ================= -->
  <main class="main">
    <header class="topbar">
      <div class="page-title">
        <div class="page-icon" id="page-icon" data-icon="grid"></div>
        <div>
          <h1 id="page-title">Panel principal</h1>
          <p class="subtitle" id="page-sub">Estado de la ejecución y proveedor cloud</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="status-pill"><span class="dot"></span><span id="status-pill-text">Conectando…</span></span>
        <a class="btn" href="/api/cluster/estado" target="_blank" rel="noopener"><i data-icon="download"></i>JSON</a>
        <a class="btn primary" href="#cluster" id="top-run"><i data-icon="play"></i>Nuevo análisis</a>
      </div>
    </header>

    <!-- Cada sección se dibuja con los datos REALES del clúster (etcd). -->
    <!-- ========== 1. Panel principal ========== -->
    <section data-section="panel"><div id="panel-root"></div></section>
    <!-- ========== 2. Procesamiento ADN ========== -->
    <section data-section="adn" class="hidden"><div id="adn-root"></div></section>
    <!-- ========== 3. Rendimiento ========== -->
    <section data-section="rendimiento" class="hidden"><div id="perf-root"></div></section>
    <!-- ========== 4. Multicloud ========== -->
    <section data-section="multicloud" class="hidden"><div id="mc-root"></div></section>
    <!-- ========== 6. Evaluación S11 (experimentos en las 5 nubes) ========== -->
    <section data-section="evaluacion" class="hidden"><div id="ev-root"></div></section>
    <!-- ========== 5. Clúster (líder elegido con etcd + WireGuard entre 5 nubes) ========== -->
    <section data-section="cluster" class="hidden">
      <div id="cl-setup"></div>
      <!-- barra de mando -->
      <div class="card cl-bar" id="cl-bar">
        <div class="cl-status" id="cl-status"></div>
        <form class="cl-controls" id="cl-form" novalidate>
          <label class="cl-inline">Patrones
            <input id="cl-patrones" type="text" value="TATAAA,GAATTC" spellcheck="false" autocomplete="off" aria-label="Patrones separados por coma"></label>
          <button class="btn primary" type="submit" id="cl-run"><i data-icon="play"></i><span id="cl-run-label">Analizar</span></button>
          <button class="btn" type="button" id="cl-cancel"><i data-icon="stop"></i>Cancelar</button>
          <button class="btn" type="button" id="cl-net-btn"><i data-icon="zap"></i>Medir red</button>
          <label class="cl-inline">Ceder mando a
            <select id="cl-ceder-sel" aria-label="Nube que tomará el mando"></select></label>
          <button class="btn" type="button" id="cl-ceder">Ceder</button>
          <button class="btn" type="button" id="cl-adv-btn" aria-expanded="false">Opciones</button>
        </form>
        <div class="cl-adv hidden" id="cl-adv"></div>
      </div>
      <!-- 5 nubes -->
      <div class="cl-nodes" id="cl-nodes"></div>
      <!-- mapa de fragmentos -->
      <div class="card" style="margin-top:16px">
        <div class="card-head" style="margin-bottom:10px">
          <div><h2 class="card-title" id="cl-frag-title">Fragmentos</h2><p class="card-sub" id="cl-frag-sub">sin trabajo en curso</p></div>
          <div class="legend" id="cl-legend" style="margin:0"></div>
        </div>
        <div class="cl-frags" id="cl-frags"></div>
        <div class="cl-summary" id="cl-summary"></div>
      </div>
      <!-- pestañas -->
      <div class="card" style="margin-top:16px">
        <div class="tabs" role="tablist" id="cl-tabs">
          <button role="tab" data-tab="comparacion">Comparación por nube</button>
          <button role="tab" data-tab="costo">Costo por transacción</button>
          <button role="tab" data-tab="tiempo">Línea de tiempo</button>
          <button role="tab" data-tab="red">Red entre nubes</button>
          <button role="tab" data-tab="datos">Datos en las nubes</button>
          <button role="tab" data-tab="historial">Historial</button>
          <button role="tab" data-tab="eventos">Eventos</button>
        </div>
        <div id="cl-tab-body" style="margin-top:16px"></div>
      </div>
    </section>
  </main>
</div>
<div id="tooltip" class="hidden" role="tooltip"></div>
<script src="/cluster.js"></script>
<script src="/secciones.js"></script>
<script src="/evaluacion.js"></script>
<script src="/app.js"></script>
</body>
</html>
